[build]
  command = "npx expo export --platform web && cp manifest.json web-build/ && cp service-worker.js web-build/ && cp -r icons web-build/"
  publish = "web-build"

[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "application/javascript"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "application/manifest+json"