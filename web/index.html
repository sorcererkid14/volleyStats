<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />

    <!-- PWA -->
    <meta name="theme-color" content="#A855F7" />
    <meta name="description" content="Volleyball match tracking and analytics" />
    <link rel="manifest" href="/manifest.json" />

    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="VolleyStats" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />

    <title>VolleyStats</title>
    <style>
      html, body { background-color: #0A0C14; margin: 0; padding: 0; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    %SCRIPT%

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/service-worker.js')
            .then(function (reg) {
              console.log('SW registered:', reg.scope);
              // Check for updates every time the page loads
              reg.update();
            })
            .catch(function (err) {
              console.log('SW failed:', err);
            });
        });
      }
    </script>
  </body>
</html>
